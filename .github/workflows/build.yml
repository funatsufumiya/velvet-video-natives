      - name: Zip for Artifacts
        run: |
          zip -r natives-free.zip natives-free
          zip -r natives-full.zip natives-full
          
      - name: Upload Artifacts (free)
        uses: actions/upload-artifact@v3
        with:
          name: native-libs-${{ matrix.os }}-${{ matrix.arch }}
          path: natives-free.zip

      - name: Upload Artifacts (full)
        uses: actions/upload-artifact@v3
        with:
          name: native-libs-${{ matrix.os }}-${{ matrix.arch }}
          path: natives-full.zip

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          
      - name: Build with Gradle
        shell: bash
        run: ./gradlew clean jar --no-daemon

      - name: Upload Artifacts (from Gradle)
        uses: actions/upload-artifact@v3
        with:
          name: gradle-build-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            natives-free/build/libs/*.jar
            natives-full/build/libs/*.jar

