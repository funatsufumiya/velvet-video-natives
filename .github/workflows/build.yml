name: Build Native Libraries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
      
      - name: Build FFmpeg Prepare
        run: |
          docker build -t ffmpeg-prepare - < script/Dockerfile-prepare
      
      - name: Build Platform Specific Image
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            docker build -t ffmpeg-linux - < script/Dockerfile-linux
          else
            docker build -t ffmpeg-windows - < script/Dockerfile-windows
          fi
        shell: bash
      
      - name: Create Output Directory
        run: mkdir -p script/output
        shell: bash
      
      - name: Run Platform Build
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            docker run -v ${PWD}/script/output:/output --name ffmpeg-lin --rm ffmpeg-linux
          else
            docker run -v ${PWD}/script/output:/output --name ffmpeg-win --rm ffmpeg-windows
          fi
        shell: bash
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: native-libs-${{ matrix.os }}
          path: script/output/release

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          
      - name: Build with Gradle
        run: ./gradlew clean jar --no-daemon
        shell: bash